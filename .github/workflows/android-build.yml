name: Android Build

on:
  push:
    branches:
      - main
      - tonep-branding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build universal debug APK
        run: ./gradlew --no-daemon :app:assembleUniversalDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest
